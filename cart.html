<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOYNEXTDOOR - Cart</title>
    <link href="cart.css" rel="stylesheet">
</head>

<body>

    <header class="top-nav">
        <a href="product(selection).html" class="back-button">&lt;</a>
        <div class="logo-container">
            <img src="images/bndlogowhite.png" alt="BOYNEXTDOOR Logo" class="header-logo">
        </div>
        <div class="spacer"></div>
    </header>

    <main class="cart-container">
        <h1 class="cart-title">YOUR CART:</h1>

        <div class="product-card">
            <div class="product-image-col">
                <img src="images/sales file/productTA.png" alt="BOYNEXTDOOR Album" class="cart-img">
            </div>
            
            <div class="product-info-col">
                <h2 class="product-name">BOYNEXTDOOR -<br>The Action</h2>
                
                <div class="product-details">
                    <div class="detail-row">
                        <span class="label">Version</span>
                        <span class="value">PLAY</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">Quantity</span>
                        <span class="value">- 1 -</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="divider-line"></div>

        <div class="order-total">
            <span>Order Total:</span>
            <span class="price">$28.50</span>
        </div>

        <a href="payment.html" class="continue-btn">CONTINUE</a>
    </main>
    <div class="home-icon">
        <a href="Index.html">
            <img src="images/bndsublogo.png" alt="home button">
        </a>
    </div>

    <footer class="main-footer">
        <div class="footer-left">
            <img src="images/kozlogo.png" alt="KOZ Logo" class="footer-brand-logo">
        </div>

        <div class="footer-right">
            <h3>KOZ ENTERTAINMENT</h3>
            <p>A. 42, Hangang daero, Yongsan gu, Seoul, 04389</p>
            <p>ALL RIGHTS RESERVED. &copy; 2025 KOZ ENTERTAINMENT</p>
            <a href="#" class="privacy-link">PRIVACY POLICY</a>
        </div>
    </footer>

</body>

</html>
