<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOYNEXTDOOR - Thankyou_shop</title>
    <link href="./css/normalize.css" rel="stylesheet">
    <link href="./css/thankyou(shop).css" rel="stylesheet">
</head>

<body>

    <!-- HEADER -->
    <header class="top-nav">
        <a href="payment(shop).html" class="back-button">&lt;</a>
        <div class="logo-container">
            <img src="./images/bndlogowhite.png" alt="BOYNEXTDOOR Logo" class="header-logo">
        </div>
        <div class="spacer"></div>
    </header>

    <!-- THANK YOU CONTENTS-->
    <div class="main-container">
        <div class="order-card">
            <h1 class="thank-you-text">THANK YOU<br>FOR BUYING!</h1>

            <div class="product-section">
                <img src="./images/sales file/productTA.png" alt="The Action Album" class="product-img">
                
                <div class="product-details">
                    <h2 class="product-title">BOYNEXTDOOR -<br>The Action</h2>
                    
                    <div class="detail-row">
                        <span class="label">Version</span>
                        <span class="value">PLAY</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">Quantity</span>
                        <span class="value">- 1 -</span>
                    </div>
                    <div class="detail-row total">
                        <span class="label">Order Total:</span>
                        <span class="value">$28.50</span>
                    </div>
                </div>
            </div>

            <div class="divider-line"></div>

            <div class="button-group">
                <a href="Index.html" class="action-btn">MAIN HOME</a>
                <a href="Product(options).html" class="action-btn">CONTINUE</a>
            </div>
        </div>
    </div>

    <!--HOME ICON-->
    <div class="home-icon">
        <a href="Index.html">
            <img src="./images/bndsublogo.png" alt="home button">
        </a>
    </div>

    <!-- FOOTER -->
    <footer class="main-footer">
        <div class="footer-left">
            <img src="./images/kozlogo.png" alt="KOZ Logo" class="footer-brand-logo">
        </div>

        <div class="footer-right">
            <h3>KOZ ENTERTAINMENT</h3>
            <p>A. 42, Hangang daero, Yongsan gu, Seoul, 04389</p>
            <p>ALL RIGHTS RESERVED. &copy; 2025 KOZ ENTERTAINMENT</p>
            <a href="https://kozofficial.com/etc/privacy" class="privacy-link">PRIVACY POLICY</a>
        </div>
    </footer>

</body>

</html>
