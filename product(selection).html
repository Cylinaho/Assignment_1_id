<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOYNEXTDOOR - Shop</title>
    <link href="product(options).css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="top-nav">
        <a href="Index.html" class="back-button">&lt;</a>

        <div class="logo-container">
            <img src="images/bndlogowhite.png" alt="BOYNEXTDOOR Logo" class="header-logo">
        </div>

        <div class="cart-container">
            <a href="cart.html">
                <img src="images/bag.png" alt="Shopping Bag" class="nav-bag-icon" style="width: 30px; height: auto;">
            </a>
        </div> 
    </header>

    <main class="content-wrapper">
        <div class="product-card">
            
            <div class="product-image-col">
                <img src="images/productTA.png" alt="The Action Album" class="main-product-img">
            </div>

            <div class="product-details-col">
                <h1 class="product-title">BOYNEXTDOOR - The Action</h1>
                <p class="product-price">$28.50</p>

                <div class="selection-group">
                    <label>Version</label>
                    <div class="version-buttons">
                        <a href="product_play.html" class="ver-btn active">PLAY</a>
                        <button type="button" class="ver-btn">LOADING</button>
                        <button type="button" class="ver-btn">PAUSE</button>
                    </div>
                </div>

                <div class="selection-group">
                    <label>Quantity</label>
                    <div class="quantity-selector">
                        <button class="qty-btn">-</button>
                        <span class="qty-num">1</span>
                        <button class="qty-btn">+</button>
                    </div>
                </div>

                <button class="add-to-cart-btn">ADD TO CART</button>
            </div>
        </div>
    </main>

    <div class="home-icon">
        <a href="Index.html">
            <img src="images/bndsublogo.png" alt="home button">
        </a>
    </div>

    <footer class="main-footer">
        <div class="footer-left">
            <img src="images/kozlogo.png" alt="KOZ Logo" class="footer-brand-logo">
        </div>

        <div class="footer-right">
            <h3>KOZ ENTERTAINMENT</h3>
            <p>A. 42, Hangang daero, Yongsan gu, Seoul, 04389</p>
            <p>ALL RIGHTS RESERVED. &copy; 2025 KOZ ENTERTAINMENT</p>
            <a href="#" class="privacy-link">PRIVACY POLICY</a>
        </div>
    </footer>

</body>
</html>
