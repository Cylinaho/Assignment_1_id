<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOYNEXTDOOR - Shop</title>
    <link href="product(selection).css" rel="stylesheet">
</head>
<body>

    <header class="top-nav">
        <a href="Index.html" class="back-button">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </a>

        <div class="logo-container">
            <!-- Using a placeholder alt text since image is local -->
            <img src="images/bndlogowhite.png" alt="BOYNEXTDOOR" class="header-logo" onerror="this.style.display='none'; this.parentElement.innerText='BOYNEXTDOOR'">
        </div>

        <div class="cart-container">
            <a href="cart.html">
                <img src="images/concert/bag.png" alt="Bag" class="nav-bag-icon" onerror="this.style.backgroundColor='#0075b4'; this.style.borderRadius='50%'">
            </a>
        </div> 
    </header>

    <main class="content-wrapper">
        <div class="product-card">
            
            <div class="product-image-col">
                <img src="images/sales file/productTA.png" alt="The Action Album" class="main-product-img">
            </div>

            <div class="product-details-col">
                <h1 class="product-title">BOYNEXTDOOR - The Action</h1>
                <p class="product-price">$28.50</p>

                <div class="selection-group">
                    <label>Version</label>
                    <div class="version-buttons" id="versionContainer">
                        <button type="button" class="ver-btn active">PLAY</button>
                        <button type="button" class="ver-btn">LOADING</button>
                        <button type="button" class="ver-btn">PAUSE</button>
                    </div>
                </div>

                <div class="selection-group">
                    <label>Quantity</label>
                    <div class="quantity-selector">
                        <button class="qty-btn">-</button>
                        <span class="qty-num" id="qtyDisplay">1</span>
                        <button class="qty-btn">+</button>
                    </div>
                </div>

                <button class="add-to-cart-btn">ADD TO CART</button>
            </div>
        </div>
    </main>

    <div class="home-icon">
        <a href="Index.html">
            <img src="images/bndsublogo.png" alt="Home" onerror="this.style.display='none';">
        </a>
    </div>

    <footer class="main-footer">
        <div class="footer-left">
            <img src="images/kozlogo.png" alt="KOZ Logo" class="footer-brand-logo" onerror="this.style.display='none'; this.parentElement.innerText='KOZ ENTERTAINMENT'">
        </div>

        <div class="footer-right">
            <h3>KOZ ENTERTAINMENT</h3>
            <p>A. 42, Hangang daero, Yongsan gu, Seoul, 04389</p>
            <p>ALL RIGHTS RESERVED. &copy; 2025 KOZ ENTERTAINMENT</p>
            <a href="#" class="privacy-link">PRIVACY POLICY</a>
        </div>
    </footer>
</body>
</html>
