<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOYNEXTDOOR - Shop_selection</title>
    <link href="product(selection).css" rel="stylesheet">
</head>

<body>

    <header class="top-nav">
        <a href="Product(options).html" class="back-button">&lt;</a>

        <div class="logo-container">
            <!-- Using a placeholder alt text since image is local -->
            <img src="images/bndlogowhite.png" alt="BOYNEXTDOOR" class="header-logo"
                onerror="this.style.display='none'; this.parentElement.innerText='BOYNEXTDOOR'">
        </div>

        <div class="cart-container">
            <a href="cart.html">
                <img src="images/concert/bag.png" alt="Bag" class="nav-bag-icon"
                    onerror="this.style.backgroundColor='#0075b4'; this.style.borderRadius='50%'">
            </a>
        </div>
    </header>

    <main class="content-wrapper">
        <div class="product-card">

            <div class="product-image-col">
                <img src="images/sales file/productTA.png" alt="The Action Album" class="main-product-img">
            </div>

            <div class="product-details-col">
                <h1 class="product-title">BOYNEXTDOOR - The Action</h1>
                <p class="product-price">$28.50</p>

                <!-- This is a form so the inputs work together -->
                <form action="cart.html" style="width: 100%;">

                    <div class="selection-group">
                        <label>Version</label>
                        <div class="version-buttons" id="versionContainer">
                            <!-- 
                                LOGIC: Radio buttons with labels. 
                                The 'name' attribute must be the same for all three (e.g., "version") so only one can be selected at a time.
                            -->

                            <!-- Option 1: PLAY -->
                            <input type="radio" name="version" id="opt-play" class="version-selector" value="PLAY"
                                checked>
                            <label for="opt-play" class="ver-btn">PLAY</label>

                            <!-- Option 2: LOADING -->
                            <input type="radio" name="version" id="opt-loading" class="version-selector"
                                value="LOADING">
                            <label for="opt-loading" class="ver-btn">LOADING</label>

                            <!-- Option 3: PAUSE -->
                            <input type="radio" name="version" id="opt-pause" class="version-selector" value="PAUSE">
                            <label for="opt-pause" class="ver-btn">PAUSE</label>
                        </div>
                    </div>

                    <div class="selection-group">
                        <label>Quantity</label>
                        <!-- 
                             LOGIC: Replaced the + / - buttons with a standard HTML input.
                             min="1" and max="10" handles the range limits automatically.
                        -->
                        <div class="quantity-selector-container">
                            <input type="number" class="qty-input-styled" name="quantity" min="1" max="10" value="1">
                        </div>
                    </div>

                    <button class="add-to-cart-btn">ADD TO CART</button>
                </form>

            </div>
        </div>
    </main>

    <div class="home-icon">
        <a href="Index.html">
            <img src="images/bndsublogo.png" alt="Home" onerror="this.style.display='none';">
        </a>
    </div>

    <footer class="main-footer">
        <div class="footer-left">
            <img src="images/kozlogo.png" alt="KOZ Logo" class="footer-brand-logo"
                onerror="this.style.display='none'; this.parentElement.innerText='KOZ ENTERTAINMENT'">
        </div>

        <div class="footer-right">
            <h3>KOZ ENTERTAINMENT</h3>
            <p>A. 42, Hangang daero, Yongsan gu, Seoul, 04389</p>
            <p>ALL RIGHTS RESERVED. &copy; 2025 KOZ ENTERTAINMENT</p>
            <a href="#" class="privacy-link">PRIVACY POLICY</a>
        </div>
    </footer>
</body>

</html>
