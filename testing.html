<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOYNEXTDOOR - Shop</title>
    <!-- Link to the external CSS file -->
    <link href="product.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="top-nav">
        <a href="Index.html" class="back-button">&lt;</a>

        <div class="logo-container">
            <img src="images/bndlogowhite.png" alt="BOYNEXTDOOR Logo" class="header-logo">
        </div>

        <div class="cart-container">
            <a href="cart.html">
                <img src="images/bag.png" alt="Shopping Bag" class="nav-bag-icon">
            </a>
        </div> 
    </header>

    <main class="content-wrapper">
        <div class="product-card">
            
            <div class="product-image-col">
                <img src="images/productTA.png" alt="The Action Album" class="main-product-img">
            </div>

            <div class="product-details-col">
                <h1 class="product-title">BOYNEXTDOOR - The Action</h1>
                <p class="product-price">$28.50</p>

                <div class="selection-group">
                    <label>Version: <span id="selected-version-text" style="font-weight:400; margin-left:5px;">PLAY</span></label>
                    <div class="version-buttons">
                        <button type="button" class="ver-btn active" onclick="selectVersion(this, 'PLAY')">PLAY</button>
                        <button type="button" class="ver-btn" onclick="selectVersion(this, 'LOADING')">LOADING</button>
                        <button type="button" class="ver-btn" onclick="selectVersion(this, 'PAUSE')">PAUSE</button>
                    </div>
                </div>

                <div class="selection-group">
                    <label>Quantity</label>
                    <div class="quantity-selector">
                        <button class="qty-btn" id="qty-minus" onclick="updateQuantity(-1)">-</button>
                        <span class="qty-num" id="qty-display">1</span>
                        <button class="qty-btn" id="qty-plus" onclick="updateQuantity(1)">+</button>
                    </div>
                </div>

                <button class="add-to-cart-btn" onclick="addToCart()">ADD TO CART</button>
            </div>
        </div>
    </main>

    <div class="home-icon">
        <a href="Index.html">
            <img src="images/bndsublogo.png" alt="home button">
        </a>
    </div>

    <footer class="main-footer">
        <div class="footer-left">
            <img src="images/kozlogo.png" alt="KOZ Logo" class="footer-brand-logo">
        </div>

        <div class="footer-right">
            <h3>KOZ ENTERTAINMENT</h3>
            <p>A. 42, Hangang daero, Yongsan gu, Seoul, 04389</p>
            <p>ALL RIGHTS RESERVED. &copy; 2025 KOZ ENTERTAINMENT</p>
            <a href="#" class="privacy-link">PRIVACY POLICY</a>
        </div>
    </footer>

    <script>
        // 1. Version Selection Logic
        let currentVersion = "PLAY"; // Default

        function selectVersion(btnElement, versionName) {
            // Remove 'active' class from all version buttons
            const buttons = document.querySelectorAll('.ver-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            // Add 'active' class to the clicked button
            btnElement.classList.add('active');

            // Update the state and UI text
            currentVersion = versionName;
            document.getElementById('selected-version-text').textContent = versionName;
            console.log("Selected Version:", currentVersion);
        }

        // 2. Quantity Logic (Range 1 - 10)
        let quantity = 1;
        const minQty = 1;
        const maxQty = 10;
        
        const display = document.getElementById('qty-display');
        const minusBtn = document.getElementById('qty-minus');
        const plusBtn = document.getElementById('qty-plus');

        function updateQuantity(change) {
            const newQuantity = quantity + change;

            // Check if within range
            if (newQuantity >= minQty && newQuantity <= maxQty) {
                quantity = newQuantity;
                display.textContent = quantity;
            }
        }

        // 3. Add to Cart (Mock Function)
        function addToCart() {
            alert(`Added to Cart:\nAlbum: The Action\nVersion: ${currentVersion}\nQuantity: ${quantity}`);
        }
    </script>

</body>
</html>
