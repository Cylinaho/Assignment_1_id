<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOYNEXTDOOR - Shop</title>
    <link href="ticket.css" rel="stylesheet">
</head>

<body>

    <header class="top-nav">
        <a href="index.html" class="back-button">&lt;</a>
        <div class="logo-container">
            <img src="images/bndlogowhite.png" alt="BOYNEXTDOOR Logo" class="header-logo">
        </div>
        <div class="spacer"></div>
    </header>

    <div class="seating-section">
        <h2 class="section-title">SEATING PLAN</h2>
        <p class="subtitle">BOYNEXTDOOR TOUR 'KNOCK ON VOL.1' IN SINGAPORE</p>

        <div class="map-container">
            <img src="images/concert/stage.jpg" alt="Seating Plan" class="seat-img">
        </div>

        <div class="legend-box">
            <span class="dot vip"></span> VIP
            <span class="dot cat1"></span> CAT 1
            <span class="dot cat2"></span> CAT 2
            <span class="dot cat3"></span> CAT 3
        </div>
    </div>

    <div class="booking-wrapper">
        <div class="booking-box">
            <h2 class="form-title">Book a Ticket</h2>

            <form action="#" method="POST">

                <div class="form-group">
                    <label>Ticket Type</label>
                    <input type="text" placeholder="" required>
                </div>

                <div class="form-group">
                    <label>Qty</label>
                    <input type="number" min="1" max="10" required>
                </div>

                <div class="form-group">
                    <label>Mobile</label>
                    <input type="tel" required>
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <input type="text" required>
                </div>

                <button type="submit" class="submit-btn">BUY TICKET</button>

            </form>
        </div>
    </div>

    <div class="home-icon">
        <a href="Index.html">
            <img src="images/bndsublogo.png" alt="home button">
        </a>
    </div>

    <footer class="main-footer">
        <div class="footer-left">
            <img src="images/kozlogo.png" alt="KOZ Logo" class="footer-brand-logo">
        </div>

        <div class="footer-right">
            <h3>KOZ ENTERTAINMENT</h3>
            <p>A. 42, Hangang daero, Yongsan gu, Seoul, 04389</p>
            <p>ALL RIGHTS RESERVED. &copy; 2025 KOZ ENTERTAINMENT</p>
            <a href="#" class="privacy-link">PRIVACY POLICY</a>
        </div>
    </footer>

</body>

</html>
